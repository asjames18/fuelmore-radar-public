name: Verify public source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      # The production public Worker deploys the build:public bundle; gate it
      # (including the owner-content isolation check) on every push so a bad
      # public build can never reach production unnoticed.
